version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/postgresql/data
    #    healthcheck:
    #      test: [ "CMD-SHELL", "pg_isready -U myuser" ]
    #      interval: 10s
    #      timeout: 5s
    #      retries: 5
    ports:
      - "5432:5432"

volumes:
  db_data:

networks:
  appnet:
    driver: bridge

