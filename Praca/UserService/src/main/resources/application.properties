spring.application.name=UserService
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/appdb
spring.datasource.username=root
spring.datasource.password=1qaz2wsx
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
#App config
app.security.jwt.rsa.private-key=-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----
app.security.jwt.rsa.public-key=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
app.security.filter.permitGet=/accounts
app.security.filter.anonymous=/myauth/login, /myauth/register/*
app.security.filter.enabled=true








