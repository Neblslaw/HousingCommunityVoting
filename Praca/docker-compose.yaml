version: '3.9'

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"

    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_PASSWORD=1qaz2wsx
      - POSTGRES_USER=root
    volumes:
      - db_data:/var/lib/postgresql/data

  voting-service:
    image: voting-service
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
  estate-service:
    image: estate-service
    ports:
      - "9191:9191"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
  notification-service:
    image: notification-service
    ports:
      - "9292:9292"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
  user-service:
    image: user-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb

  voting-front:
    image: voting-front
    ports:
      - "5173:5173"
    environment:
      API_TARGET: 'http://user-service:8080'
      VOTING_TARGET: 'http://voting-service:9090'
      ESTATE_TARGET: 'http://estate-service:9191'
      NOTIFICATION_TARGET: 'http://notification-service:9292'
      VOTES_TARGET: 'ws://voting-service:9090'

volumes:
  db_data: